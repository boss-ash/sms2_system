name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  php-lint:
    name: PHP syntax check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Lint PHP files
        run: |
          set -e
          while IFS= read -r -d '' file; do
            php -l "$file"
          done < <(find . -name '*.php' \
            -not -path './.git/*' \
            -not -path './sms2_system/*' \
            -not -path './vendor/*' \
            -not -path './storage/uploads/*' \
            -not -path './storage/backups/*' \
            -print0)
